name: "datasets-lint"
description: "Audit a dataset for duplicates, PII, contamination and schema problems"
author: "datasets-lint contributors"
branding:
  icon: "check-circle"
  color: "purple"

inputs:
  paths:
    description: "Dataset files to audit (space separated)"
    required: true
  checks:
    description: "Comma separated check ids (default: all)"
    required: false
    default: ""
  fail-on:
    description: "none | warn | error"
    required: false
    default: "error"
  profile:
    description: "default | strict | ci | dev"
    required: false
    default: ""
  report:
    description: "Path for the HTML report"
    required: false
    default: "datasets-lint-report.html"
  sarif:
    description: "Path for the SARIF report (empty disables)"
    required: false
    default: "datasets-lint.sarif"
  version:
    description: "datasets-lint version to run"
    required: false
    default: "latest"

outputs:
  verdict:
    description: "ok | warn | error"
    value: ${{ steps.lint.outputs.verdict }}

runs:
  using: "composite"
  steps:
    - uses: astral-sh/setup-uv@v5
    - id: lint
      shell: bash
      run: |
        set +e
        PKG="datasets-lint"
        if [ "${{ inputs.version }}" != "latest" ]; then PKG="datasets-lint==${{ inputs.version }}"; fi
        ARGS=""
        if [ -n "${{ inputs.checks }}" ]; then ARGS="$ARGS --checks ${{ inputs.checks }}"; fi
        if [ -n "${{ inputs.profile }}" ]; then ARGS="$ARGS --profile ${{ inputs.profile }}"; fi
        if [ -n "${{ inputs.sarif }}" ]; then ARGS="$ARGS --sarif ${{ inputs.sarif }}"; fi
        uvx --from "$PKG" datasets-lint run ${{ inputs.paths }} \
          --fail-on ${{ inputs.fail-on }} \
          --report ${{ inputs.report }} $ARGS
        code=$?
        echo "verdict=$([ $code -eq 0 ] && echo ok || echo error)" >> "$GITHUB_OUTPUT"
        exit $code
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: datasets-lint-report
        path: |
          ${{ inputs.report }}
          ${{ inputs.sarif }}

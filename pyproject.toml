[project]
name = "datasets-lint"
version = "0.2.0"
description = "ruff for training data: audit datasets for duplicates, PII, leakage and contamination"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "datasets-lint contributors" }]
keywords = ["datasets", "data-quality", "llm", "machine-learning", "linter", "deduplication", "pii"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "polars>=1.0",
  "datasketch>=1.6",
  "jinja2>=3.1",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
hf = ["datasets>=2.18"]
ner = ["spacy>=3.7"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
datasets-lint = "datasets_lint.cli:main"

[project.urls]
Homepage = "https://github.com/horizonbymuneeb/datasets-lint"
Issues = "https://github.com/horizonbymuneeb/datasets-lint/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datasets_lint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Types
        run: |
          uv pip install mypy
          uv run mypy
      - name: Tests
        run: |
          uv pip install coverage
          uv run coverage run -m pytest
          uv run coverage report

  self-lint:
    # dogfood: the linter must run cleanly on its own fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Audit fixtures
        run: |
          uvx --from . datasets-lint run tests/fixtures/clean.jsonl --report clean.html
          uvx --from . datasets-lint run tests/fixtures/dirty.jsonl --fail-on none \
            --report dirty.html --sarif dirty.sarif --fix /tmp/dirty.clean.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: self-lint-reports
          path: |
            *.html
            *.sarif

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx --with mkdocs-material mkdocs build --strict

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv build
      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/datasets-lint --version
          /tmp/venv/bin/datasets-lint run tests/fixtures/dirty.jsonl --fail-on none --fix /tmp/out.jsonl
      - name: Docker image
        run: docker build -t datasets-lint:ci .
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
